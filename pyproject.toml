[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-stream-lifecycle"
version = "0.1.0a1"
description = "Real HTTP server fixtures for testing streaming ASGI applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pytest>=8,<10",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "httpx-sse>=0.4,<0.5",
]

[project.urls]
Source = "https://github.com/shenxi200-eng/pytest-stream-lifecycle"
Issues = "https://github.com/shenxi200-eng/pytest-stream-lifecycle/issues"

[project.optional-dependencies]
dev = ["ruff", "build", "twine", "pytest-cov", "starlette", "fastapi", "sse-starlette"]

[project.entry-points.pytest11]
stream_lifecycle = "pytest_stream_lifecycle.plugin"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
